timezone: Asia/Seoul

schedule:
  premarket: "08:00"
  reevaluate: ["09:30", "11:00", "13:00"]
  exit_check_minutes: 15
  market_open: "09:00"
  market_close: "15:00"
  buy_cutoff: "14:00"
  holidays: []

universe:
  liquidity_top_n: 300
  liquidity_window: 20
  max_daily_move: 0.30

candidates:
  top_n: 15
  ma_window: 20
  require_rising_ma: false
  ma_slope_days: 5
  rank_among: all
  momentum:
    lookback_days: 120
    skip_recent_days: 20
    high_window_days: 250
    weight_return: 0.5
    weight_high: 0.5
  overheat:
    max_ret_5d: 0.15
    max_ret_1d: 0.08

risk:
  max_weight_per_stock: 0.15
  max_positions: 6
  min_buy_ratio: 0.5
  internal_trade_limit_per_hour: 30

exit:
  stop_loss: -0.04
  take_profit: 0.06
  take_profit_sell_ratio: 1.0
  max_holding_days: 5

review:
  min_cases: 5
  window_days: 5
  recovery_ratio: 0.5
  stop_fill_limit: -0.05
  tp_extra: 0.10
  tp_extra_ratio: 0.5

order:
  buy_type: market
  sell_type: market

fees:
  commission: 0.00015
  sell_tax: 0.002

llm:
  use_llm: true
  temp_rule_top_n: 3
  model: gemini-3.5-flash
  max_headlines_per_stock: 5
  max_retries: 1
  timeout_seconds: 120

api:
  max_calls_per_minute: 80

db:
  path: data/aqua.db

log:
  dir: logs
  level: INFO

news:
  lookback_days: 3
  request_timeout_seconds: 20
  request_interval_seconds: 1
  aliases:
    "000660": ["SK하이닉스", "SK 하이닉스"]
    "005380": ["현대차", "현대자동차"]
    "035420": ["NAVER", "네이버"]
  match_exclusions:
    "005380": ["현대차증권"]

disclosure:
  enabled: true
  lookback_days: 5
  request_timeout_seconds: 10
  request_interval_seconds: 1
  corp_refresh_days: 7
  max_pages: 100
  max_per_stock: 5
  block_buy_days: 5
  block_keywords: ["관리종목", "상장폐지", "매매거래정지", "횡령", "배임", "불성실공시", "감사의견", "유상증자결정"]

regime:
  enabled: true
  top_n: 200
  min_stocks: 150
  ma_short: 20
  ma_long: 60
  max_equity_ratio: {up: 0.9, sideways: 0.6, down: 0.3}
  default_when_missing: sideways
